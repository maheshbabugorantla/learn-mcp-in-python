[project]
name = "mcp-advanced-features-python"
version = "0.1.0"
description = "Advanced MCP server features in Python — elicitation, sampling, progress, cancellation, and change notifications"
requires-python = ">=3.10"
# Runtime: the MCP SDK is the only dependency. pytest (a dev dependency) drives
# the exercises; every advanced feature here is exercised in memory, with a fake
# client supplying the LLM (sampling) and the human (elicitation).
dependencies = ["mcp==1.28.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # An interactive shell and a better debugger for poking at the SDK and its
    # docs while you work (import mcp, tab-complete, drop a breakpoint()).
    "ipython>=8.39.0",
    "pdbpp>=0.12.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.uv]
# Self-contained exercise directories, not an installable package.
package = false
