name: tests

on:
  push:
  pull_request:

jobs:
  imports:
    name: no private SDK imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The SDK's in-memory transport lives in a private module. Reaching for it
      # would break without a major-version signal, and this repo teaches by
      # example -- the exercises use the public `Client` instead.
      - name: Check for private mcp imports
        run: make check-imports

  solutions:
    name: ${{ matrix.course }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        course:
          - mcp-fundamentals
          - mcp-auth
          - mcp-ui
          - mcp-advanced-features
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      # uv reads requires-python from pyproject.toml and installs Python itself.
      - name: Install ${{ matrix.course }}
        run: make -C ${{ matrix.course }} install

      - name: Verify ${{ matrix.course }} reference solutions
        run: make -C ${{ matrix.course }} test

      # The starting point of every exercise must fail on its TODO (exit 1) —
      # not pass by accident, and not break at import/collection.
      - name: Verify ${{ matrix.course }} problems start red
        run: make -C ${{ matrix.course }} test-problems
