[project]
name = "mcp-ui-python"
version = "0.1.0"
description = "Learn the MCP-UI sub-spec by building a journal that sends UI, in Python"
requires-python = ">=3.10"
# Runtime: the MCP SDK is the only dependency. Starlette, uvicorn and pydantic
# come with it, so the runnable demo uses them without adding anything new.
dependencies = ["mcp>=2.1,<3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # An interactive shell and a better debugger for poking at the SDK and its
    # docs while you work (import mcp, tab-complete, drop a breakpoint()).
    "ipython>=8.39.0",
    "pdbpp>=0.12.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.uv]
# The exercises are self-contained directories, not an installable package —
# each has its own server.py, so there's nothing to build.
package = false
