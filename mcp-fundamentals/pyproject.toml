[project]
name = "epicme-mcp-python"
version = "1.0.0"
description = "Learn the Model Context Protocol by building an MCP server in Python"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
    # Runtime: the MCP server you build needs only the SDK to run.
    "mcp>=2.1,<3",
]

[dependency-groups]
dev = [
    # Tooling to work through the course: the test runner, its async support,
    # and the optional `uv run mcp dev` Inspector (the `cli` extra — needs Node).
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mcp[cli]>=2.1,<3",
    "ipython>=8.39.0",
    "pdbpp>=0.12.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["exercises"]
python_files = ["test_*.py"]

[tool.uv]
package = false
